<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>札签 · 楠屿札记</title>
<meta name="description" content="楠屿札记的札签卷宗：把文章装进分类卷宗，拆签即读。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='43' font-family='Inter,-apple-system,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/inter.css">
<script>
  /* 主题与博客同键（sj.theme）：从博客跳进来、跳回去，明暗连续 */
  (function () {
    try { if (localStorage.getItem('sj.theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/cards.css">
<style>
  /* 独立页壳样式：body 级规则、VT 时长、顶栏/页脚。
     体验本体（卷宗/牌堆/阅读/总目/托盘）在 css/cards.css，按 .cards-scope 作用域。 */
  html,body{height:100%}
  :root{--spring:linear(0, 0.006, 0.028 2.3%, 0.104 4.9%, 0.228 7.6%, 0.552 14.2%, 0.812 19.7%, 0.944 24.2%, 1.034 28.9%, 1.092 34.2%, 1.11 38.6%, 1.108 42.4%, 1.088 47.2%, 1.032 56.8%, 0.99 66.2%, 0.968 75.8%, 0.968 87.7%, 0.984 97.4%, 1)}
  ::view-transition-group(*){animation-duration:.55s;animation-timing-function:var(--spring)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
.site-top{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  background:color-mix(in oklab, var(--paper) 78%, transparent);
  border-bottom:1px solid var(--line);
}
.site-top-in{width:min(1160px,94vw);margin:0 auto;height:48px;display:flex;align-items:center;gap:16px}
.site-brand{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.site-brand:hover{opacity:.8}
.site-links{display:flex;align-items:center;gap:16px;margin-left:auto}
.site-links a{font-size:12px;color:var(--ink-soft);text-decoration:none;transition:color .2s}
.site-links a:hover{color:var(--ink)}
#themeToggle{padding:5px 10px;font-size:12px;line-height:1}
@media (max-width:560px){
  .site-links a{display:none}          /* 窄屏只留品牌 + 主题钮，链接回首页根路径可达 */
}
.site-foot{
  background:var(--foot-bg);
  border-top:1px solid var(--line);padding:44px 0 52px;text-align:center;
  font-size:12px;color:var(--ink-soft);letter-spacing:.04em;
}
</style>
</head>
<body class="cards-scope cards-page">

<header class="site-top">
  <div class="site-top-in">
    <a class="site-brand" href="./">楠屿札记</a>
    <nav class="site-links">
      <a href="./#blog">文章</a>
      <a href="archive.html">归档</a>
      <button id="themeToggle" class="btn" type="button" aria-label="切换明暗">☾</button>
    </nav>
  </div>
</header>

<!-- 体验本体挂载根：js/cards.js 的 CardsCore.mount 往这里注入全部骨架 -->
<main id="cards-main"></main>

<footer class="site-foot">© 2026 楠屿札记 · 慢慢写，慢慢看</footer>

<script src="js/articles.js"></script>
<script src="js/cards.js"></script>
<script>
  CardsCore.mount(document.getElementById('cards-main'), {
    mode: 'full',
    standalone: true,
    themeBtn: document.getElementById('themeToggle')
  });
</script>
</body>
</html>

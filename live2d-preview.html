<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板娘调试台 · 楠屿札记</title>
<!--
  Live2D 看板娘调试/诊断页（开发用，不进站点导航）
  ----------------------------------------------------
  正式页面的看板娘有三道省电闸（js/live2d.js）：
    ① 系统开启「减少动态效果」→ 不加载（无障碍尊重）
    ② 壁纸引擎判定弱机档（软渲染/无 WebGL）→ 不加载
    ③ 右上角 × 写过 sj.live2d=off → 永久关闭
  本页全部绕过强制加载，并做"闸门体检"：显示当前浏览器在正式页面会被哪道闸挡住，
  能自动修的（关闭标记）当场修。本地预览：仓库根 python -m http.server 8327
  → http://localhost:8327/live2d-preview.html
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 10px;
    background: #0a0a0c; color: #b8bcc4;
    font: 14px/1.9 "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 17px; color: #e8eaee; font-weight: 600; margin: 0; }
  p { margin: 0; color: #7c8089; font-size: 13px; }
  code { background: #17181d; border: 1px solid #2a2c33; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .checkup {
    margin-top: 16px; text-align: left; min-width: 460px;
    border: 1px solid #2a2c33; border-radius: 10px; padding: 14px 18px;
    background: #101116;
  }
  .checkup h2 { font-size: 13px; color: #8fd0ff; margin: 0 0 8px; font-weight: 600; }
  .checkup div { font-size: 13px; color: #9aa0aa; white-space: pre-wrap; }
  .ok   { color: #7ad48a; }
  .warn { color: #ffc46b; }
  .fix  { color: #8fd0ff; }
  .status { font-size: 12px; color: #5b5f68; }
  .status b { color: #8fd0ff; font-weight: 600; }
  /* 调试台没有主站 css/style.css 的覆盖，原生 waifu.css 把她摆在左下——这里对齐正式站的右下角 */
  #waifu { left: auto !important; right: 0 !important; bottom: 0 !important; z-index: 30 !important; }
  #waifu-tips { left: auto !important; right: 24px !important; }
  #live2d-close { right: 6px !important; left: auto !important; }
</style>
</head>
<body>
  <h1>看板娘调试台</h1>
  <p>右下角就是她（本页绕过全部闸门强制加载）。摸头=蹭手心 · 戳身体=惊跳/笑场 · 点全息屏=打字 · 鼠标移动=视线跟随</p>

  <div class="checkup">
    <h2>正式页面闸门体检（当前浏览器）</h2>
    <div id="checkup">检测中…</div>
  </div>
  <p class="status" id="status">正在加载运行时与模型…</p>

  <script>
  (function () {
    'use strict';
    var lines = [];

    // ---- 闸门体检（先读原值，再自动修复）----
    var closedRaw = null;
    try { closedRaw = localStorage.getItem('sj.live2d'); } catch (e) {}
    if (closedRaw === 'off') {
      lines.push('<span class="fix">[已修复]</span> 关闭标记 sj.live2d=off —— 你之前点过她右上角的 ×。本页已改为显式开启，<b style="color:#e8eaee">回去刷新正式页面她就会回来</b>。');
    } else if (closedRaw === 'on') {
      lines.push('<span class="ok">[通过]</span> 显式开启中（sj.live2d=on）——正式页面会加载她，即使系统开了减少动效。');
    } else {
      lines.push('<span class="ok">[通过]</span> 关闭标记：未设置');
    }

    var reduced = false;
    try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduced) {
      if (closedRaw === 'on') {
        lines.push('<span class="ok">[已放行]</span> 系统开了「减少动态效果」，但你显式开启过看板娘——正式页面照样加载。');
      } else {
        lines.push('<span class="warn">[被挡]</span> 系统开了「减少动态效果」——正式页默认按无障碍规范不加载。本页已帮你写入显式开启（sj.live2d=on），<b style="color:#e8eaee">刷新正式页面即可出现</b>；不想开了在左下角齿轮面板关掉即可。');
      }
    } else {
      lines.push('<span class="ok">[通过]</span> 减少动态效果：未开启');
    }

    var webgl = false, renderer = '';
    try {
      var gl = document.createElement('canvas').getContext('webgl');
      webgl = !!gl;
      var ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      renderer = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
    } catch (e) {}
    var soft = /swiftshader|software|llvmpipe/i.test(renderer);
    if (!webgl) lines.push('<span class="warn">[被挡]</span> 浏览器没有 WebGL——检查浏览器设置里「硬件加速」是否关闭。');
    else if (soft) lines.push('<span class="warn">[被挡]</span> WebGL 走的软件渲染（' + renderer + '）——正式页会判为弱机档不加载她。浏览器设置里开启「硬件加速」可解。');
    else lines.push('<span class="ok">[通过]</span> WebGL 硬件加速：' + (renderer || '正常'));

    var fine = false, wide = false;
    try { fine = matchMedia('(pointer: fine)').matches; wide = matchMedia('(min-width: 1024px)').matches; } catch (e) {}
    lines.push(fine && wide
      ? '<span class="ok">[通过]</span> 视口 ' + innerWidth + 'px / 鼠标指针'
      : '<span class="warn">[被挡]</span> 视口 ' + innerWidth + 'px（需 ≥1024 且鼠标设备）——窗口拉大即可。');

    document.getElementById('checkup').innerHTML = lines.join('<br>');
    if (reduced || soft || !webgl) {
      document.getElementById('checkup').innerHTML +=
        '<br><span class="fix">↑ 本页不受这些闸影响，右下角照样加载；但正式页面会被挡。</span>';
    }

    // 简历镜像档不放看板娘（与 js/live2d.js 的闸门一致）
    if (/(^|\.)pages\.dev$/.test(location.hostname)) {
      document.getElementById('status').innerHTML = 'pages.dev 是简历用的干净镜像，不放看板娘——去 <b>7stevejohn.github.io</b> 看。';
      return;
    }
    // ---- 绕闸加载 ----
    var orig = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var m = orig(q);
      if (q.indexOf('prefers-reduced-motion') !== -1) {
        return { matches: false, media: q, onchange: null,
          addEventListener: function(){}, removeEventListener: function(){},
          addListener: function(){}, removeListener: function(){}, dispatchEvent: function(){ return false; } };
      }
      return m;
    };
    // 不加载 wallpaper.js → live2d.js 见不到 __fxTier，直接按强机走
    // 写入显式开启：正式页面从此豁免减少动效闸（本页的核心修复动作）
    try { localStorage.setItem('sj.live2d', 'on'); } catch (e) {}

    var status = document.getElementById('status');
    var s = document.createElement('script');
    s.src = 'js/live2d.js';
    s.onload = function () {
      var n = 0;
      var timer = setInterval(function () {
        n++;
        var waifu = document.getElementById('waifu');
        if (waifu && waifu.classList.contains('waifu-active')) {
          status.innerHTML = '看板娘已上线。正式页面看不到的话，看上面体检面板里标 <b>[被挡]</b> 的那一行。';
          clearInterval(timer);
        } else if (n > 45) {
          status.innerHTML = '45 秒还没就绪：确认是通过 <b>http(s)://…/live2d-preview.html</b> 访问（file:// 会被 CORS 挡），或按 <b>F12</b> 看 Network 里模型请求';
          clearInterval(timer);
        }
      }, 1000);
    };
    s.onerror = function () {
      status.innerHTML = 'js/live2d.js 加载失败 —— 必须通过本地服务器/线上域名访问，不能双击文件打开';
    };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>

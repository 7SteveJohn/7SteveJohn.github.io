<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Geometric Motif: Memory Wave & Half-life Decay -->
  <g opacity="0.75" transform="translate(370, 75)">
    <g stroke="rgba(56, 189, 248, 0.2)" fill="none" stroke-width="1.5">
      <rect x="0" y="0" width="220" height="130" rx="10"/>
      <!-- Grid lines inside canvas -->
      <line x1="20" y1="20" x2="20" y2="110" stroke="rgba(255,255,255,0.08)"/>
      <line x1="20" y1="110" x2="200" y2="110" stroke="rgba(255,255,255,0.08)"/>
      <!-- Decay curve -->
      <path d="M 20 30 Q 70 85, 200 105" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Threshold dotted line -->
      <line x1="20" y1="95" x2="200" y2="95" stroke="#818cf8" stroke-dasharray="4,4" stroke-width="1.5"/>
      <!-- Nodes on curve -->
      <circle cx="20" cy="30" r="4.5" fill="#38bdf8"/>
      <circle cx="70" cy="72" r="3.5" fill="#38bdf8"/>
      <circle cx="130" cy="95" r="3.5" fill="#818cf8"/>
      <circle cx="180" cy="103" r="2.5" fill="rgba(255,255,255,0.4)"/>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(40, 42)">
    <rect width="146" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#38bdf8"/>
    <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">MEMORY MECHANISM</text>
  </g>

  <!-- Big Label -->
  <text x="590" y="65" text-anchor="end" fill="url(#glow)" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">SHIHAI · SYS</text>

  <!-- Content Group -->
  <g transform="translate(40, 225)">
    <text x="0" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" letter-spacing="0.5">识海记忆系统：机制篇</text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" letter-spacing="0.3">双轴衰减 · 影子抽取 · 动态校准与三层召回</text>
  </g>
</svg>
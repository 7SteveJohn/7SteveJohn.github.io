<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Geometric Motif: Append-only Event Stream & SQLite Blocks -->
  <g opacity="0.75" transform="translate(360, 80)">
    <g stroke="rgba(45, 212, 191, 0.25)" fill="none" stroke-width="1.5">
      <!-- Events Timeline Blocks -->
      <rect x="0" y="20" width="65" height="40" rx="6" fill="rgba(45, 212, 191, 0.06)"/>
      <line x1="65" y1="40" x2="85" y2="40" stroke="#2dd4bf" stroke-width="1.5"/>
      
      <rect x="85" y="20" width="65" height="40" rx="6" fill="rgba(45, 212, 191, 0.06)"/>
      <line x1="150" y1="40" x2="170" y2="40" stroke="#2dd4bf" stroke-width="1.5"/>
      
      <rect x="170" y="20" width="65" height="40" rx="6" fill="rgba(45, 212, 191, 0.12)" stroke="#2dd4bf"/>
      
      <!-- Fold Projection to SQLite View -->
      <path d="M 32 60 L 32 85 L 115 85" stroke-dasharray="3,3"/>
      <path d="M 117 60 L 117 85" stroke-dasharray="3,3"/>
      <path d="M 202 60 L 202 85 L 120 85" stroke-dasharray="3,3"/>
      
      <!-- SQLite View Box -->
      <rect x="55" y="92" width="130" height="34" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8"/>
      <text x="120" y="113" fill="#38bdf8" text-anchor="middle" font-family="monospace" font-size="10.5">facts (view)</text>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(40, 42)">
    <rect width="138" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#2dd4bf"/>
    <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">EVENT SOURCING</text>
  </g>

  <!-- Big Label -->
  <text x="590" y="65" text-anchor="end" fill="url(#glow)" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">SHIHAI · DB</text>

  <!-- Content Group -->
  <g transform="translate(40, 225)">
    <text x="0" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" letter-spacing="0.5">识海记忆系统：存储篇</text>
    <text x="0" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" letter-spacing="0.3">Append-only 事件流 · 墓碑标记与物理清除</text>
  </g>
</svg>
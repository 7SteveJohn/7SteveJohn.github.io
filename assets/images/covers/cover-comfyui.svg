<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c1122"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Geometric Motif -->
  <g opacity="0.6">
    
      <g stroke="rgba(244, 63, 94, 0.25)" fill="none" stroke-width="1.5">
        <rect x="410" y="95" width="60" height="40" rx="4" fill="rgba(244, 63, 94, 0.1)"/>
        <rect x="510" y="95" width="60" height="40" rx="4" fill="rgba(139, 92, 246, 0.1)"/>
        <rect x="460" y="150" width="60" height="40" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
        <path d="M 470 115 L 510 115" stroke="#f43f5e"/>
        <path d="M 440 135 L 460 170" stroke="#8b5cf6"/>
        <path d="M 540 135 L 520 170" stroke="#38bdf8"/>
      </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(40, 42)">
    <rect width="130" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#f43f5e"/>
    <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">AIGC WORKFLOW</text>
  </g>

  <!-- Big Number -->
  <text x="590" y="70" text-anchor="end" fill="url(#glow)" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">COMFYUI</text>

  <!-- Content Group -->
  <g transform="translate(40, 230)">
    <!-- English Subtitle -->
    <text x="0" y="0" fill="#f43f5e" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" opacity="0.9">NODE-BASED GENERATION PIPELINE</text>
    <!-- Chinese Main Title -->
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" letter-spacing="0.5">ComfyUI 工作流实践</text>
    <!-- Decorative underline -->
    <rect x="0" y="58" width="48" height="3" rx="1.5" fill="url(#glow)"/>
    <rect x="54" y="58" width="12" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c1122"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#spot)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Geometric Motif -->
  <g opacity="0.6">
    
      <g stroke="rgba(56, 189, 248, 0.25)" fill="none" stroke-width="1.5">
        <rect x="415" y="90" width="130" height="90" rx="8"/>
        <path d="M 415 115 L 545 115"/>
        <circle cx="445" cy="145" r="16"/>
        <line x1="456" y1="156" x2="472" y2="172" stroke-width="2.5" stroke="#38bdf8"/>
        <rect x="485" y="135" width="45" height="6" rx="3" fill="rgba(129, 140, 248, 0.3)"/>
        <rect x="485" y="148" width="30" height="6" rx="3" fill="rgba(129, 140, 248, 0.2)"/>
      </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(40, 42)">
    <rect width="130" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#38bdf8"/>
    <text x="26" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">LOCAL RAG</text>
  </g>

  <!-- Big Number -->
  <text x="590" y="70" text-anchor="end" fill="url(#glow)" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">FILEBUTLER</text>

  <!-- Content Group -->
  <g transform="translate(40, 230)">
    <!-- English Subtitle -->
    <text x="0" y="0" fill="#38bdf8" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" opacity="0.9">LOCAL VECTOR & FTS5 ENGINE</text>
    <!-- Chinese Main Title -->
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" letter-spacing="0.5">本地文件管家与秒搜问答</text>
    <!-- Decorative underline -->
    <rect x="0" y="58" width="48" height="3" rx="1.5" fill="url(#glow)"/>
    <rect x="54" y="58" width="12" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  </g>
</svg>
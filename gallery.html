<!DOCTYPE html>

  <!-- 默认晨曦明亮科技风（与首页统一规范，支持自由切换与持久化） -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        if (localStorage.getItem('sj.theme-v6') !== 'daylight-v1') {
          localStorage.removeItem('sj.theme');
          localStorage.setItem('sj.theme-v6', 'daylight-v1');
        }
        if (localStorage.getItem('sj.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <meta name="description" content="楠屿札记的照片墙：心仪的二次元角色立绘、插画收藏与自留图，点开可以看大图。" />

  <link rel="manifest" href="manifest.json" />

  <header class="site-header sticky top-0 z-40 w-full site-nav glass-spec bg-white/80 dark:bg-[#0a0a0c]/80 border-b border-[#d2d2d7]/50 dark:border-white/10 transition-colors">

      <div class="flex items-center gap-4 sm:gap-6">
        <nav class="flex items-center gap-4 sm:gap-6 text-slate-700 dark:text-[#86868b] text-xs">

          <a href="gallery.html" class="subpage-nav-active hover:text-black dark:hover:text-white transition" aria-current="page">照片墙</a>

        </button>

  <main class="page-wrap">
    <div class="page-head reveal">

      <h1 class="page-title">照片墙</h1>
      <p class="page-sub">

      </p>
    </div>

    <div id="gallery-grid" data-nav-label="照片墙"></div>

  <footer class="border-t border-[#d2d2d7]/50 dark:border-white/10 py-12 bg-slate-50/80 dark:bg-[#0a0a0c] text-xs text-slate-500 dark:text-[#86868b]">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 space-y-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <span class="font-semibold text-slate-900 dark:text-white">楠屿札记</span>
          <span> · 本地工具、技术手记与文字创作</span>
        </div>
        <div class="flex items-center gap-6">

    </div>

  <!-- 灯箱：复用站点弹窗语言（.modal-overlay / .modal-panel / .lg-dim），只补大图与说明条 -->
  <div id="gal-lightbox" role="dialog" aria-modal="true" aria-label="图片查看" class="modal-overlay lg-dim hidden fixed inset-0 z-50 flex justify-center p-4 sm:p-6 bg-black/55 overflow-y-auto">
    <div class="modal-panel gal-panel glass-spec relative m-auto w-full bg-white dark:bg-[#161617] rounded-2xl shadow-2xl overflow-hidden border border-black/10 dark:border-white/10 my-8">
      <button type="button" class="gal-close" aria-label="关闭（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="gal-figure">
        <img id="gal-img" alt="" />
      </div>
      <div class="gal-bar">
        <div>
          <b id="gal-caption"></b>
          <span class="gal-meta" id="gal-meta"></span>
        </div>
        <div class="gal-actions">
          <span class="gal-index" id="gal-index"></span>
          <button type="button" data-gal-step="-1" aria-label="上一张（←）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" data-gal-step="1" aria-label="下一张（→）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全部 defer：subpage.js 管 SW/导航态/主题切换/浮现，gallery.js 负责照片墙渲染与灯箱 -->
  <script src="js/bundles/core.js" defer></script>
  <script src="js/bundles/sub.js" defer></script>
  <script src="js/gallery.js" defer></script>
